<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pitha ghor</title>
    <style>
        form .basic-info label{
            display: block;
        }
    </style>
</head>
<body>
    <header></header>
    <main>
        <h1>Lia Pitha Ghar</h1>
        <form>
            <fieldset class="basic-info">
                <legend>basic info:</legend>
                 <label for="name">name:</label>
                 <input type="text" id="name"> <br> <br>
                 <label for="email">email:</label>
                 <input type="email" id="email"><br><br>
            </fieldset>
            <fieldset>
                <legend>select one pitha:</legend>
                <input type="radio" name="pitha" id="chitoi">
                <label for="chitoi">chitoi</label><br><br>
                <input type="radio" name="pitha" id="vapa">
                <label for="vapa">vapa</label><br><br>
                <input type="radio" name="pitha" id="dal puri">
                <label for="dal puri">dal puri</label>
            </fieldset>
            <br><br>
            <fieldset>
                <legend>vorta selection:</legend>
                <input type="checkbox" id="sutki vorta">
                <label for="sutki vorta">sutki vorta</label><br><br>
                <input type="checkbox" id="dhoniya vorta">
                <label for="dhoniya vorta">dhoniya vorta</label><br><br>
                <input type="checkbox" id="sorisha vorta">
                <label for="sorisha vorta">sorisha vorta</label>
            </fieldset><br><br>
            <button type="reset">reset</button><br><br>
            <button type=" submit">submit</button>
            
        </form>
    </main>   
    <footer></footer> 
</body>
</html>
